<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OpenCode 会话</title>
<style>
  :root {
    --bg: #1a1a2e;
    --bg2: #16213e;
    --bg3: #1e2a4a;
    --bg-hover: #253a5e;
    --text: #e0e0e0;
    --text-dim: #8899aa;
    --text-bright: #f0f0f0;
    --accent: #4fc3f7;
    --accent2: #81c784;
    --accent3: #ffb74d;
    --border: #2a3a5a;
    --sidebar-w: 320px;
    --user-msg: #1a3a5a;
    --assistant-msg: #1e2a3e;
    --radius: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── Layout ── */
  .app { display: flex; height: 100vh; }
  .sidebar { width: var(--sidebar-w); min-width: var(--sidebar-w);
             background: var(--bg2); display: flex; flex-direction: column;
             border-right: 1px solid var(--border); }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  /* ── Sidebar ── */
  .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
  .sidebar-header h1 { font-size: 16px; color: var(--text-bright); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .sidebar-header h1 span { color: var(--accent); }
  .search-box { width: 100%; padding: 8px 12px; border: 1px solid var(--border);
                border-radius: var(--radius); background: var(--bg3); color: var(--text);
                font-size: 13px; outline: none; transition: border-color .2s; }
  .search-box:focus { border-color: var(--accent); }
  .search-box::placeholder { color: var(--text-dim); }

  .sidebar-content { flex: 1; overflow-y: auto; padding: 8px 0; }
  .sidebar-footer { padding: 10px 16px; border-top: 1px solid var(--border);
                    font-size: 12px; color: var(--text-dim); }

  .dir-group { margin-bottom: 4px; }
  .dir-header { padding: 6px 16px; font-size: 11px; font-weight: 600;
                color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px;
                cursor: pointer; display: flex; align-items: center; gap: 6px;
                user-select: none; }
  .dir-header:hover { color: var(--accent); }
  .dir-header .arrow { transition: transform .2s; font-size: 10px; }
  .dir-header .arrow.open { transform: rotate(90deg); }

  .session-item { padding: 10px 16px 10px 28px; cursor: pointer; border-left: 3px solid transparent;
                  transition: all .15s; }
  .session-item:hover { background: var(--bg-hover); }
  .session-item.active { background: var(--bg-hover); border-left-color: var(--accent); }
  .session-item .title { font-size: 13px; color: var(--text); white-space: nowrap;
                          overflow: hidden; text-overflow: ellipsis; }
  .session-item .meta { font-size: 11px; color: var(--text-dim); margin-top: 3px;
                         display: flex; gap: 8px; flex-wrap: wrap; }
  .session-item .meta .model { color: var(--accent2); }
  .session-item .meta .time { color: var(--text-dim); }

  /* ── Stats bar ── */
  .stats-bar { display: flex; gap: 16px; padding: 8px 16px; font-size: 12px;
                color: var(--text-dim); border-bottom: 1px solid var(--border);
                flex-wrap: wrap; background: var(--bg2); }
  .stats-bar span { display: flex; align-items: center; gap: 4px; }
  .stats-bar .num { color: var(--text-bright); font-weight: 600; }

  /* ── Main area ── */
  .main-header { padding: 12px 20px; border-bottom: 1px solid var(--border);
                 background: var(--bg2); display: flex; align-items: center; gap: 12px; }
  .main-header .back-btn { display: none; background: none; border: none; color: var(--accent);
                           cursor: pointer; font-size: 18px; padding: 4px; }
  .main-header h2 { font-size: 15px; color: var(--text-bright); flex: 1;
                     white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .main-header .info { font-size: 12px; color: var(--text-dim); white-space: nowrap; }

  .messages { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .empty-state { display: flex; flex-direction: column; align-items: center;
                  justify-content: center; height: 100%; color: var(--text-dim); }
  .empty-state h2 { font-size: 20px; margin-bottom: 8px; }
  .empty-state p { font-size: 14px; text-align: center; max-width: 400px; }
  .empty-state .big-icon { font-size: 48px; margin-bottom: 16px; opacity: .3; }

  .msg { margin-bottom: 16px; display: flex; gap: 12px; }
  .msg-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex;
                 align-items: center; justify-content: center; font-size: 14px;
                 flex-shrink: 0; font-weight: 600; }
  .msg.user .msg-avatar { background: #1565c0; color: #fff; }
  .msg.assistant .msg-avatar { background: #2e7d32; color: #fff; }
  .msg.tool .msg-avatar { background: #6a1b9a; color: #fff; }

  .msg-body { flex: 1; min-width: 0; }
  .msg-body .role-label { font-size: 11px; color: var(--text-dim); margin-bottom: 4px;
                           text-transform: uppercase; letter-spacing: .5px; }
  .msg-body .content { background: var(--assistant-msg); padding: 12px 16px;
                        border-radius: var(--radius); font-size: 14px; line-height: 1.6;
                        white-space: pre-wrap; word-break: break-word; }
  .msg.user .content { background: var(--user-msg); }
  .msg-body .meta-line { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

  /* ── Loading ── */
  .loading { text-align: center; padding: 40px; color: var(--text-dim); }
  .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--border);
              border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Mobile ── */
  @media (max-width: 768px) {
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 100;
               transform: translateX(-100%); transition: transform .25s; }
    .sidebar.open { transform: translateX(0); }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5);
                        z-index: 99; }
    .sidebar-overlay.show { display: block; }
    .main-header .back-btn { display: block; }
    .menu-btn { display: block !important; background: none; border: none;
                 color: var(--text); font-size: 20px; cursor: pointer; padding: 4px; }
  }
  .menu-btn { display: none; }
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1><span>&#9670;</span> OpenCode 会话</h1>
      <input class="search-box" id="searchBox" placeholder="搜索会话..." oninput="onSearch()">
    </div>
    <div class="sidebar-content" id="sessionList"></div>
    <div class="sidebar-footer" id="statsFooter"></div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="main-header">
      <button class="menu-btn" onclick="toggleSidebar()">&#9776;</button>
      <button class="back-btn" id="backBtn" onclick="showList()">&larr;</button>
      <h2 id="mainTitle">选择一个会话</h2>
      <span class="info" id="mainInfo"></span>
    </div>
    <div class="stats-bar" id="statsBar"></div>
    <div class="messages" id="messagesArea">
      <div class="empty-state">
        <div class="big-icon">&#9670;</div>
        <h2>OpenCode 会话查看器</h2>
        <p>从左侧选择一个会话查看对话历史，或使用搜索框快速定位。</p>
      </div>
    </div>
  </main>
</div>

<script>
// ── State ──
let sessions = [];
let currentSessionId = null;
let allDirectories = [];
let allSessions = [];

// ── API ──
async function api(path) {
  const res = await fetch(path);
  return res.json();
}

// ── Sidebar ──
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}

// ── Init ──
async function init() {
  // Load stats
  const stats = await api('/api/stats');
  document.getElementById('statsBar').innerHTML = `
    <span>&#128202; 会话 <span class="num">${stats.total_sessions}</span></span>
    <span>&#128193; 项目 <span class="num">${stats.total_projects}</span></span>
    <span>&#9889; Input <span class="num">${fmtTokens(stats.total_tokens_input)}</span></span>
    <span>&#9889; Output <span class="num">${fmtTokens(stats.total_tokens_output)}</span></span>
  `;
  document.getElementById('statsFooter').textContent = `共 ${stats.total_sessions} 个会话 · ${stats.total_projects} 个项目`;

  // Load directories
  const dirsData = await api('/api/directories');
  allDirectories = dirsData.directories;

  // Load all sessions
  const sessData = await api('/api/sessions?limit=200');
  allSessions = sessData.sessions;
  sessions = allSessions;

  renderSidebar();
}

// ── Render sidebar ──
function renderSidebar() {
  const container = document.getElementById('sessionList');
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  let filtered = sessions;
  if (q) {
    filtered = sessions.filter(s =>
      s.title.toLowerCase().includes(q) ||
      s.directory.toLowerCase().includes(q) ||
      s.model.toLowerCase().includes(q) ||
      s.project.toLowerCase().includes(q)
    );
  }

  // Group by directory
  const groups = {};
  for (const s of filtered) {
    if (!groups[s.directory]) groups[s.directory] = { path: s.directory, name: s.project, sessions: [] };
    groups[s.directory].sessions.push(s);
  }

  // Sort groups
  const sortedGroups = Object.values(groups).sort((a, b) => {
    const ma = Math.max(...a.sessions.map(s => s.time_updated_raw || 0));
    const mb = Math.max(...b.sessions.map(s => s.time_updated_raw || 0));
    return mb - ma;
  });

  let html = '';
  for (const g of sortedGroups) {
    const gid = 'grp_' + g.path.replace(/[^a-zA-Z0-9]/g, '_');
    // Sort sessions within group by time
    g.sessions.sort((a, b) => (b.time_updated_raw || 0) - (a.time_updated_raw || 0));
    html += `<div class="dir-group">
      <div class="dir-header" onclick="toggleGroup('${gid}')">
        <span class="arrow open" id="arr_${gid}">&#9654;</span>
        ${g.name} <span style="font-weight:400;color:var(--text-dim)">(${g.sessions.length})</span>
      </div>
      <div id="${gid}">`;
    for (const s of g.sessions) {
      const active = s.id === currentSessionId ? 'active' : '';
      html += `<div class="session-item ${active}" onclick="openSession('${s.id}')">
        <div class="title">${escHtml(s.title)}</div>
        <div class="meta">
          <span class="model">${s.model}</span>
          <span class="time">${s.time_updated}</span>
        </div>
      </div>`;
    }
    html += `</div></div>`;
  }

  if (!html) {
    html = '<div class="loading" style="padding:30px;text-align:center;color:var(--text-dim)">没有匹配的会话</div>';
  }

  container.innerHTML = html;
}

function toggleGroup(id) {
  const el = document.getElementById(id);
  const arrow = document.getElementById('arr_' + id);
  if (el.style.display === 'none') {
    el.style.display = '';
    arrow.classList.add('open');
  } else {
    el.style.display = 'none';
    arrow.classList.remove('open');
  }
}

// ── Search ──
let searchTimer;
function onSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(renderSidebar, 200);
}

// ── Open session ──
async function openSession(id) {
  currentSessionId = id;
  closeSidebar();
  renderSidebar();

  const mainTitle = document.getElementById('mainTitle');
  const mainInfo = document.getElementById('mainInfo');
  const messagesArea = document.getElementById('messagesArea');
  const backBtn = document.getElementById('backBtn');

  messagesArea.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  mainTitle.textContent = '加载中...';

  const data = await api(`/api/sessions/${id}`);

  if (data.error) {
    messagesArea.innerHTML = `<div class="empty-state"><p>${data.error}</p></div>`;
    return;
  }

  const s = data.session;
  mainTitle.textContent = s.title || '未命名会话';
  mainInfo.textContent = `${s.model} · ${s.message_count} 条消息`;

  let html = '';
  for (const m of data.messages) {
    const role = m.role === 'user' ? 'user' : m.role === 'assistant' ? 'assistant' : 'tool';
    const avatar = role === 'user' ? 'U' : role === 'assistant' ? 'AI' : 'T';
    const label = role === 'user' ? '你' : role === 'assistant' ? 'AI' : '工具';
    let metaLine = '';
    if (m.tokens && m.tokens.output) {
      metaLine = `<div class="meta-line">&#9889; ${fmtTokens(m.tokens.output)} output</div>`;
    }

    html += `<div class="msg ${role}">
      <div class="msg-avatar">${avatar}</div>
      <div class="msg-body">
        <div class="role-label">${label} · ${m.time_created}</div>
        <div class="content">${escHtml(m.content) || '(空)'}</div>
        ${metaLine}
      </div>
    </div>`;
  }

  messagesArea.innerHTML = html;
  messagesArea.scrollTop = messagesArea.scrollHeight;

  // Show back button on mobile
  if (window.innerWidth <= 768) {
    backBtn.style.display = 'block';
  }
}

function showList() {
  currentSessionId = null;
  document.getElementById('mainTitle').textContent = '选择一个会话';
  document.getElementById('mainInfo').textContent = '';
  document.getElementById('messagesArea').innerHTML = `
    <div class="empty-state">
      <div class="big-icon">&#9670;</div>
      <h2>OpenCode 会话查看器</h2>
      <p>从左侧选择一个会话查看对话历史。</p>
    </div>`;
  document.getElementById('backBtn').style.display = 'none';
  document.getElementById('sessionList').innerHTML = '';
  renderSidebar();
}

// ── Utils ──
function escHtml(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function fmtTokens(n) {
  if (!n) return '0';
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
  return n.toString();
}

// ── Start ──
init();
</script>
</body>
</html>
