<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OpenCode 会话</title>
<link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1><span>&#9670;</span> OpenCode 会话</h1>
      <input class="search-box" id="searchBox" placeholder="搜索会话..." oninput="onSearch()">
    </div>
    <div class="sidebar-content" id="sessionList"></div>
    <div class="sidebar-footer">
      <button class="new-session-btn" onclick="showNewSessionModal()">&#65291; 新建会话</button>
      <div id="statsFooter"></div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="main-header">
      <button class="menu-btn" onclick="toggleSidebar()">&#9776;</button>
      <button class="back-btn" id="backBtn" onclick="showList()">&larr;</button>
      <h2 id="mainTitle">选择一个会话</h2>
      <span class="info" id="mainInfo"></span>
    </div>
    <div class="stats-bar" id="statsBar"></div>
    <div class="messages" id="messagesArea">
      <div class="empty-state">
        <div class="big-icon">&#9670;</div>
        <h2>OpenCode 会话查看器</h2>
        <p>从左侧选择一个会话查看对话历史，或使用搜索框快速定位。</p>
      </div>
    </div>
    <!-- Input area (Phase 2) -->
    <div class="input-area" id="inputArea">
      <div class="input-row">
        <select class="model-select" id="modelSelect" onchange="currentModel=this.value">
          <option value="">默认模型</option>
        </select>
        <textarea id="msgInput" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" onkeydown="onInputKeydown(event)" rows="1"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
      </div>
    </div>
  </main>
</div>

<!-- New Session Modal -->
<div class="modal-overlay" id="newSessionModal" onclick="if(event.target===this)closeNewSessionModal()">
  <div class="modal">
    <h2>&#128196; 新建会话</h2>
    <label for="newSessionDir">工作目录</label>
    <select id="newSessionDir"></select>
    <label for="newSessionMsg">初始消息</label>
    <textarea id="newSessionMsg" placeholder="输入第一条消息..." rows="3"></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeNewSessionModal()">取消</button>
      <button class="btn-primary" id="newSessionSubmit" onclick="startNewSession()">开始对话</button>
    </div>
  </div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
